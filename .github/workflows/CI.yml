name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
env:
  # Pkg clones through the git CLI, which applies the insteadOf rule below.
  JULIA_PKG_USE_CLI_GIT: true
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.version == 'pre' }}
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          - '1'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - name: Allow cloning the private BH-CAT registry and KineticSamplers
        run: |
          test -n "$TOKEN" || { echo "::error::secret KINETICSAMPLERS_TOKEN is not set"; exit 1; }
          for repo in BHCATRegistry KineticSamplers.jl; do
            git config --global url."https://x-access-token:${TOKEN}@github.com/BH-CAT/$repo".insteadOf "https://github.com/BH-CAT/$repo"
          done
        env:
          TOKEN: ${{ secrets.KINETICSAMPLERS_TOKEN }}
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
        with:
          localregistry: https://github.com/BH-CAT/BHCATRegistry.git
          git_cli: true
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - name: Allow cloning the private BH-CAT registry and KineticSamplers
        run: |
          test -n "$TOKEN" || { echo "::error::secret KINETICSAMPLERS_TOKEN is not set"; exit 1; }
          for repo in BHCATRegistry KineticSamplers.jl; do
            git config --global url."https://x-access-token:${TOKEN}@github.com/BH-CAT/$repo".insteadOf "https://github.com/BH-CAT/$repo"
          done
        env:
          TOKEN: ${{ secrets.KINETICSAMPLERS_TOKEN }}
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
        with:
          localregistry: https://github.com/BH-CAT/BHCATRegistry.git
          git_cli: true
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using BlackboxComrade
          DocMeta.setdocmeta!(BlackboxComrade, :DocTestSetup, :(using BlackboxComrade); recursive=true)
          doctest(BlackboxComrade)
  runic:
    name: Runic formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1'
